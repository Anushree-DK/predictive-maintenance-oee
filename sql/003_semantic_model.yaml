# Semantic model for Cortex Analyst — natural-language questions over the
# business tables (not RAW_SENSOR_DATA, which is per-cycle telemetry and a poor
# fit for NL Q&A; that's what src/feature_engineering.py + the ML model are for).
# Lets a fleet manager ask things like "which fleet has the worst OEE" or "how many
# work orders did we create this week".
#
# Schema follows Snowflake's Semantic View YAML spec
# (docs.snowflake.com/en/user-guide/views-semantic/semantic-view-yaml-spec).
# NOT YET APPLIED to any Snowflake account — see sql/004_create_semantic_view.sql.

name: PM_SEMANTIC_MODEL
description: >
  Turbofan engine fleets from NASA's C-MAPSS dataset: engines, their real
  run-to-failure events, per-period OEE inputs, and AI-recommended actions.
  One cycle is one flight.

tables:
  - name: MACHINE
    description: One row per engine, in service or already failed.
    base_table:
      database: PDM
      schema: PUBLIC
      table: MACHINE_DATA
    primary_key:
      columns: [MACHINE_ID]
    dimensions:
      - name: machine_id
        expr: MACHINE_ID
        data_type: VARCHAR
        description: Unique engine identifier, e.g. FD002-ENG-017.
        synonyms: ["engine", "engine id", "asset"]
      - name: fleet
        expr: FLEET
        data_type: VARCHAR
        description: Fleet the engine belongs to (FD001, FD002, FD003, FD004).
        synonyms: ["line", "fleet name", "subset"]
      - name: operating_conditions
        expr: OPERATING_CONDITIONS
        data_type: VARCHAR
        description: Number of operating conditions the fleet flies under.
      - name: fault_modes
        expr: FAULT_MODES
        data_type: VARCHAR
        description: Degradation modes present in the fleet (HPC and/or fan degradation).
      - name: status
        expr: STATUS
        data_type: VARCHAR
        description: IN_SERVICE (still flying) or FAILED (ran until failure).
    facts:
      - name: cycles_observed
        expr: CYCLES_OBSERVED
        data_type: NUMBER
        description: Flight cycles recorded for the engine.

  - name: MAINTENANCE
    description: Real failure events — one per FAILED engine.
    base_table:
      database: PDM
      schema: PUBLIC
      table: MAINTENANCE_HISTORY
    primary_key:
      columns: [EVENT_ID]
    dimensions:
      - name: machine_id
        expr: MACHINE_ID
        data_type: VARCHAR
      - name: event_type
        expr: EVENT_TYPE
        data_type: VARCHAR
        description: UNPLANNED_FAILURE — the engine ran until it failed.
      - name: description
        expr: DESCRIPTION
        data_type: VARCHAR
    facts:
      - name: event_cycle
        expr: EVENT_CYCLE
        data_type: NUMBER
        description: Cycle at which the engine failed, i.e. its total life in cycles.
        synonyms: ["life", "cycles to failure"]

  - name: OPERATING_PERIOD
    description: OEE inputs per engine per 10-cycle period, derived from sensor data.
    base_table:
      database: PDM
      schema: PUBLIC
      table: OPERATING_PERIODS
    dimensions:
      - name: machine_id
        expr: MACHINE_ID
        data_type: VARCHAR
      - name: failure_flag
        expr: FAILURE_FLAG
        data_type: BOOLEAN
        description: The engine failed during this period.
    facts:
      - name: period_index
        expr: PERIOD_INDEX
        data_type: NUMBER
      - name: cycles_flown
        expr: CYCLES_FLOWN
        data_type: NUMBER
      - name: in_spec_cycles
        expr: IN_SPEC_CYCLES
        data_type: NUMBER
        description: Cycles with every monitored sensor within 3 standard deviations of a healthy engine.
      - name: avg_health_index
        expr: AVG_HEALTH_INDEX
        data_type: FLOAT
        description: 1 = healthy, 0 = at failure.
    metrics:
      - name: availability
        expr: AVG((CYCLES_FLOWN * 2.0) / (CYCLES_FLOWN * 2.0 + IFF(FAILURE_FLAG, 18, 0)))
        description: Flight hours over flight hours plus unplanned repair downtime.
      - name: performance
        expr: AVG(LEAST(GREATEST(AVG_HEALTH_INDEX, 0), 1))
        description: Average health index — share of healthy-engine performance retained.
      - name: quality
        expr: AVG(IN_SPEC_CYCLES / CYCLES_FLOWN)
        description: Share of cycles flown with every sensor in spec.
      - name: oee
        expr: >
          AVG((CYCLES_FLOWN * 2.0) / (CYCLES_FLOWN * 2.0 + IFF(FAILURE_FLAG, 18, 0))
              * LEAST(GREATEST(AVG_HEALTH_INDEX, 0), 1)
              * (IN_SPEC_CYCLES / CYCLES_FLOWN))
        description: Overall Equipment Effectiveness = availability x performance x quality.
        synonyms: ["overall equipment effectiveness"]

  - name: ACTION
    description: Actions the AI recommended and a human confirmed, with their outcome.
    base_table:
      database: PDM
      schema: PUBLIC
      table: ACTION_OUTCOMES
    primary_key:
      columns: [ACTION_ID]
    dimensions:
      - name: machine_id
        expr: MACHINE_ID
        data_type: VARCHAR
      - name: action_type
        expr: ACTION_TYPE
        data_type: VARCHAR
        description: Create Work Order, Schedule Repair, or Recommend Parts.
        synonyms: ["work order", "action"]
      - name: risk_class_at_action
        expr: RISK_CLASS_AT_ACTION
        data_type: VARCHAR
      - name: failure_occurred
        expr: FAILURE_OCCURRED_FLAG
        data_type: BOOLEAN
        description: >
          Whether the predicted failure actually happened afterward — NULL
          means the outcome hasn't been recorded yet.
    time_dimensions:
      - name: recommended_at
        expr: RECOMMENDED_AT
        data_type: TIMESTAMP_NTZ
    facts:
      - name: rul_prediction_at_action
        expr: RUL_PREDICTION_AT_ACTION
        data_type: FLOAT
      - name: rul_lower_at_action
        expr: RUL_LOWER_AT_ACTION
        data_type: FLOAT
      - name: failure_probability_at_action
        expr: FAILURE_PROBABILITY_AT_ACTION
        data_type: FLOAT

relationships:
  - name: maintenance_to_machine
    left_table: MAINTENANCE
    right_table: MACHINE
    relationship_columns:
      - left_column: MACHINE_ID
        right_column: MACHINE_ID
  - name: period_to_machine
    left_table: OPERATING_PERIOD
    right_table: MACHINE
    relationship_columns:
      - left_column: MACHINE_ID
        right_column: MACHINE_ID
  - name: action_to_machine
    left_table: ACTION
    right_table: MACHINE
    relationship_columns:
      - left_column: MACHINE_ID
        right_column: MACHINE_ID
